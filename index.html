<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Water Status Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #61c0e9;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333333;
        }

        p {
            font-size: 16px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto;
        }

        .water-btn {
            border: none;
            color: white;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease,
                        transform 0.2s ease;

            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            min-height: 85px;
        }

        .water-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }

        .water-body-name {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .status-text {
            font-size: 12px;
            background: rgba(17, 23, 88, 0.25);
            padding: 3px 7px;
            border-radius: 4px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>Florida Water Contamination Website</h1>

    <p>
        Click any water body button to update its status
        (Password Required).
    </p>

    <div class="grid-container" id="buttonGrid"></div>

    <script>

        // ==========================================
        // PASSWORD
        // ==========================================

        const CORRECT_PASSWORD = "admin123";


        // ==========================================
        // 100 UNIQUE FLORIDA WATER BODIES
        // ==========================================

        const waterBodies = [

            // LAKES
            "Lake Okeechobee",
            "Lake Apopka",
            "Lake George",
            "Lake Tohopekaliga",
            "Lake Istokpoga",
            "Lake Seminole",
            "Lake Tarpon",
            "Lake Weir",
            "Lake Monroe",
            "Lake Dora",
            "Lake Eustis",
            "Lake Harris",
            "Lake Griffin",
            "Lake Minneola",
            "Lake Butler",
            "Lake Conway",
            "Lake Jessup",
            "Lake Harney",
            "Lake Poinsett",
            "Lake Washington",
            "Lake Winder",
            "Lake Blue Cypress",
            "Lake Santa Fe",
            "Lake Iamonia",
            "Lake Lafayette",
            "Lake Miccosukee",
            "Lake Jackson",
            "Lake Munson",
            "Lake Talquin",
            "Lake Panasoffkee",
            "Lake Thonotosassa",
            "Lake Hollingsworth",
            "Lake Haines",
            "Lake Alfred",
            "Lake Ariana",
            "Lake Blue",
            "Lake Marianna",
            "Lake Arbuckle",
            "Lake Rosalie",
            "Lake Hatchineha",
            "Lake Crescent",
            "Lake Alligator",
            "Lake Tallavana",
            "Lake Lochloosa",
            "Lake Persimmon",
            "Lake Roberts",

            // RIVERS AND CREEKS
            "St. Johns River",
            "St. Marys River",
            "Suwannee River",
            "Santa Fe River",
            "Rainbow River",
            "Hillsborough River",
            "Withlacoochee River",
            "Peace River",
            "Myakka River",
            "Manatee River",
            "Alafia River",
            "Little Manatee River",
            "Anclote River",
            "Crystal River",
            "Homosassa River",
            "Chassahowitzka River",
            "Waccasassa River",
            "Aucilla River",
            "Wakulla River",
            "St. Marks River",
            "Ochlockonee River",
            "Apalachicola River",
            "Chipola River",
            "Choctawhatchee River",
            "Blackwater River",
            "Perdido River",
            "Ocklawaha River",
            "Kissimmee River",
            "Caloosahatchee River",
            "Fisheating Creek",
            "Wekiva River",
            "Econlockhatchee River",
            "Spruce Creek",
            "Orange Creek",
            "St. Lucie River",
            "Loxahatchee River",
            "Palatlakaha River",
            "Wacissa River",
            "Shoal River",
            "Bayou Chico",

            // BAYS, LAGOONS, ESTUARIES & COASTAL WATERS
            "Florida Bay",
            "Biscayne Bay",
            "Tampa Bay",
            "Sarasota Bay",
            "Charlotte Harbor",
            "Pensacola Bay",
            "St. Andrews Bay",
            "St. Joseph Bay",
            "Apalachicola Bay",
            "Boca Ciega Bay",
            "Lemon Bay",
            "Estero Bay",
            "Gasparilla Sound",
            "Matlacha Pass",
            "Pine Island Sound",
            "Mosquito Lagoon",
            "Banana River",
            "Indian River Lagoon",
            "Lake Worth Lagoon",
            "Santa Rosa Sound",
            "Rookery Bay",
            "Cockroach Bay",
            "Alligator Harbor",
            "Pellicer Creek"
        ];


        // ==========================================
        // CREATE THE WATER BODY BUTTONS
        // ==========================================

        const gridContainer =
            document.getElementById("buttonGrid");


        // ==========================================
        // LOAD SAVED DATA
        // ==========================================

        let savedData = JSON.parse(
            localStorage.getItem("floridaWaterData")
        ) || {};


        // ==========================================
        // CREATE EACH BUTTON
        // ==========================================

        waterBodies.forEach((waterBody, index) => {

            const button =
                document.createElement("button");

            button.className = "water-btn";

            button.id =
                `water-body-${index}`;


            // Water body name
            const titleSpan =
                document.createElement("span");

            titleSpan.className =
                "water-body-name";

            titleSpan.innerText =
                waterBody;


            // Status text
            const statusSpan =
                document.createElement("span");

            statusSpan.className =
                "status-text";


            // ==========================================
            // LOAD SAVED STATUS
            // ==========================================

            if (savedData[index]) {

                statusSpan.innerText =
                    `Status: ${savedData[index].status}`;

                button.style.backgroundColor =
                    savedData[index].color;

            } else {

                statusSpan.innerText =
                    "Status: Safe";

                button.style.backgroundColor =
                    "#211F9F";
            }


            button.appendChild(titleSpan);
            button.appendChild(statusSpan);


            // ==========================================
            // BUTTON CLICK
            // ==========================================

            button.addEventListener("click", () => {

                const passwordInput =
                    prompt(
                        `Enter password to modify ${waterBody}:`
                    );


                // Cancel
                if (passwordInput === null) {
                    return;
                }


                // ==========================================
                // CHECK PASSWORD
                // ==========================================

                if (passwordInput === CORRECT_PASSWORD) {


                    // ==========================================
                    // CHANGE STATUS
                    // ==========================================

                    const currentStatus =
                        statusSpan.innerText.replace(
                            "Status: ",
                            ""
                        );


                    const newStatus =
                        prompt(
                            `Enter new contamination status for ${waterBody}:`,
                            currentStatus
                        );


                    if (
                        newStatus !== null &&
                        newStatus.trim() !== ""
                    ) {

                        statusSpan.innerText =
                            `Status: ${newStatus.trim()}`;
                    }


                    // ==========================================
                    // CHANGE COLOR
                    // ==========================================

                    const currentColor =
                        button.style.backgroundColor ||
                        "#211F9F";


                    const newColor =
                        prompt(
                            "Enter a color hex code or CSS color name:",
                            currentColor
                        );


                    if (
                        newColor !== null &&
                        newColor.trim() !== ""
                    ) {

                        button.style.backgroundColor =
                            newColor.trim();
                    }


                    // ==========================================
                    // SAVE EVERYTHING
                    // ==========================================

                    savedData[index] = {

                        status:
                            statusSpan.innerText.replace(
                                "Status: ",
                                ""
                            ),

                        color:
                            button.style.backgroundColor
                    };


                    localStorage.setItem(
                        "floridaWaterData",
                        JSON.stringify(savedData)
                    );


                } else {

                    alert(
                        "Incorrect password! Access denied."
                    );
                }

            });


            // Add button to the page
            gridContainer.appendChild(button);

        });

    </script>

</body>
</html>
