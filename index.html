            margin: 20px auto;
        }

        .water-btn {
            border: none;
            color: white;
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease,
                        transform 0.2s ease;

            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        .water-btn:hover {
            transform: translateY(-2px);

    <p>
        Click any water body button to update its status

    <div class="grid-container" id="buttonGrid"></div>

    <script>

        // ==========================================
        // PASSWORD
        // ==========================================

        const CORRECT_PASSWORD = "admin123";


        // ==========================================
        // FLORIDA WATER BODIES
        // ==========================================

        const waterBodies = [

            // LAKES
            "Lake Okeechobee",

            "Lake Hollingsworth",

            "Lake Blue",
            "Lake Marianna",
            "Lake Arbuckle",
            "Lake Rosalie",
            "Lake Hatchineha",
            "Lake Crescent",
            "Lake Alligator",
            "Lake Tallavana",
            "Lake Lochloosa",
            "Lake Persimmon",
            "Lake Roberts",

            // RIVERS AND CREEKS
            "St. Johns River",
            "St. Marys River",
            "Suwannee River",
            "Santa Fe River",
            "Rainbow River",
            "Hillsborough River",
            "Withlacoochee River",
            "Peace River",

            "Manatee River",
            "Alafia River",
            "Little Manatee River",
            "Anclote River",
            "Crystal River",
            "Homosassa River",
            "Chassahowitzka River",
            "Waccasassa River",
            "Aucilla River",
            "Wakulla River",
            "St. Marks River",
            "Ochlockonee River",
            "Apalachicola River",
            "Chipola River",
            "Choctawhatchee River",
            "Blackwater River",
            "Perdido River",
            "Ocklawaha River",
            "Kissimmee River",
            "Caloosahatchee River",
            "Fisheating Creek",
            "Wekiva River",
            "Econlockhatchee River",
            "Spruce Creek",
            "Orange Creek",
            "St. Lucie River",
            "Loxahatchee River",
            "Palatlakaha River",
            "Wacissa River",
            "Shoal River",
            "Bayou Chico",

            // BAYS, LAGOONS AND COASTAL WATERS
            "Florida Bay",
            "Biscayne Bay",
            "Tampa Bay",
            "Sarasota Bay",
            "Charlotte Harbor",
            "Pensacola Bay",
            "St. Andrews Bay",
            "St. Joseph Bay",
            "Apalachicola Bay",
            "Boca Ciega Bay",
            "Lemon Bay",
            "Estero Bay",
            "Gasparilla Sound",
            "Matlacha Pass",
            "Pine Island Sound",
            "Mosquito Lagoon",

        ];


        // ==========================================
        // GET GRID
        // ==========================================

        const gridContainer =
            document.getElementById("buttonGrid");


        // ==========================================
        // LOAD SAVED DATA
        // ==========================================

        let savedData = JSON.parse(
            localStorage.getItem("floridaWaterData")
        ) || {};


        // ==========================================
        // CREATE BUTTONS
        // ==========================================

        waterBodies.forEach((waterBody, index) => {

            const button =
                document.createElement("button");

            button.className = "water-btn";

            button.id =
                `water-body-${index}`;


            // Water body name
            const titleSpan =
                document.createElement("span");

            titleSpan.className =
                "water-body-name";

            titleSpan.innerText =
                waterBody;


            // Status
            const statusSpan =
                document.createElement("span");

            statusSpan.className =
                "status-text";


            // ==========================================
            // LOAD SAVED SETTINGS
            // ==========================================

            if (savedData[index]) {

                statusSpan.innerText =
                    `Status: ${savedData[index].status}`;

                button.style.backgroundColor =
                    savedData[index].color;

            } else {

                statusSpan.innerText =
                    "Status: Safe";

                button.style.backgroundColor =
                    "blue";
            }


            button.appendChild(titleSpan);
            button.appendChild(statusSpan);


            // ==========================================
            // BUTTON CLICK
            // ==========================================

            button.addEventListener("click", () => {

                const passwordInput =
                    prompt(
                        `Enter password to modify ${waterBody}:`
                    );


                if (passwordInput === null) {
                    return;
                }


                // ==========================================
                // PASSWORD CHECK
                // ==========================================

                if (passwordInput === CORRECT_PASSWORD) {


                    // ==========================================
                    // CHANGE STATUS
                    // ==========================================

                    const currentStatus =
                        statusSpan.innerText.replace(
                            "Status: ",
                            ""
                        );


                    const newStatus =
                        prompt(
                            `Enter new contamination status for ${waterBody}:`,
                            currentStatus
                        );


                    if (
                        newStatus !== null &&
                        newStatus.trim() !== ""
                    ) {

                        statusSpan.innerText =
                            `Status: ${newStatus.trim()}`;
                    }


                    // ==========================================
                    // CHANGE COLOR
                    // ==========================================

                    let newColor;

                    while (true) {

                        newColor = prompt(
                            "Enter a color: red, blue, or green",
                            button.style.backgroundColor
                        );


                        // User canceled
                        if (newColor === null) {
                            break;
                        }


                        newColor =
                            newColor.trim().toLowerCase();


                        // Check allowed colors
                        if (
                            newColor === "red" ||
                            newColor === "blue" ||
                            newColor === "green"
                        ) {

                            button.style.backgroundColor =
                                newColor;

                            break;

                        } else {

                            alert(
                                "Invalid color! Please type only red, blue, or green."
                            );
                        }
                    }


                    // ==========================================
                    // SAVE CHANGES
                    // ==========================================

                    savedData[index] = {

                        status:
                            statusSpan.innerText.replace(
                                "Status: ",
                                ""
                            ),

                        color:
                            button.style.backgroundColor
                    };


                    localStorage.setItem(
                        "floridaWaterData",
                        JSON.stringify(savedData)
                    );


                } else {

                    alert(
                        "Incorrect password! Access denied."
                    );
                }

            });


            // Add button
            gridContainer.appendChild(button);

        });

    </script>
